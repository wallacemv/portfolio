server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: cache longo + 404 limpo se ausente
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rotas prerenderizadas: arquivo pronto por rota; sem ele, cai no shell do SPA
    location ~ ^/(?:portfolio/)?(?<rt>paint|about|projects|infra)/?$ {
        try_files /$rt/index.html /index.html =404;
    }
    location = /portfolio/ {
        try_files /index.html =404;
    }
    location = /portfolio {
        return 301 /portfolio/;
    }

    # Home e demais rotas: SPA fallback. Desconhecidas => 404 real (body = index.html)
    location / {
        try_files $uri $uri/ =404;
        error_page 404 =404 /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
